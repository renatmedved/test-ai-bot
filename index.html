<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="result" role="status"></p>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const button = form.querySelector("button");
    const topics = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      result.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();
        if (reply.ok && data.status === "ready") {
          result.textContent = `Тема: ${topics[data.topic]}\n\nЧерновик ответа:\n${data.draft}`;
        } else if (reply.ok && data.status === "manual_review") {
          result.textContent = "Проверьте заявку вручную и подготовьте ответ клиенту.";
        } else if (data.status === "invalid_input") {
          result.textContent = "Введите текст заявки.";
        } else {
          result.textContent = "Не удалось разобрать заявку. Попробуйте ещё раз.";
        }
      } catch {
        result.textContent = "Не удалось разобрать заявку. Попробуйте ещё раз.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
